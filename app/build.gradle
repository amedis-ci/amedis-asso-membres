plugins {
    id 'com.android.application'
}

// Renseignés automatiquement par GitHub au moment de la fabrication
def depotGithub = System.getenv('GITHUB_REPOSITORY') ?: ''
def versionAppli = System.getenv('APP_VERSION') ?: '2.1.0'
def numeroFabrication = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def cleSignature = System.getenv('KEYSTORE_FILE')

android {
    namespace 'ci.amedis.asso.membres'
    compileSdk 34

    defaultConfig {
        applicationId 'ci.amedis.asso.membres'
        minSdk 21
        targetSdk 34
        versionCode numeroFabrication
        versionName versionAppli
        buildConfigField 'String', 'DEPOT', "\"${depotGithub}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (cleSignature) {
                storeFile file(cleSignature)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'amedis'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig cleSignature ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lecture des codes QR par les services Google (aucune autorisation caméra à demander)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Tirer pour actualiser
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Code QR de la carte de membre numérique
    implementation 'com.google.zxing:core:3.5.3'
}
