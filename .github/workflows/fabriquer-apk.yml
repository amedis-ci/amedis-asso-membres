name: Fabriquer l'APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de la version (ex. 1.0.0, puis 1.0.1, 1.1.0…)"
        required: true
        default: "1.0.0"
      notes:
        description: "Nouveautés de cette version (affichées sur les téléphones)"
        required: false
        default: "Améliorations et corrections."

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Préparer et vérifier la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret manquant : il faut KEYSTORE_BASE64 et KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cle_android.jks" 2>/dev/null || true
          if ! keytool -list -keystore "$RUNNER_TEMP/cle_android.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Clé de signature illisible : recollez SECRET_2_KEYSTORE_BASE64.txt dans KEYSTORE_BASE64 et SECRET_1_KEYSTORE_PASSWORD.txt dans KEYSTORE_PASSWORD (Ctrl+A, Ctrl+C, puis Ctrl+A, Ctrl+V)."
            exit 1
          fi
          echo "Clé de signature correcte."
          echo "KEYSTORE_FILE=$RUNNER_TEMP/cle_android.jks" >> "$GITHUB_ENV"

      - name: Fabriquer l'APK
        env:
          APP_VERSION: ${{ inputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "AMEDIS_Asso_Membres_${{ inputs.version }}.apk"

      - name: Publier la version (téléchargement + mises à jour automatiques)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: AMEDIS Asso Membres ${{ inputs.version }}
          body: ${{ inputs.notes }}
          files: AMEDIS_Asso_Membres_${{ inputs.version }}.apk
          make_latest: true

      - name: Conserver aussi l'APK dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: AMEDIS_Asso_Membres_${{ inputs.version }}
          path: AMEDIS_Asso_Membres_${{ inputs.version }}.apk
